# Meaningful local smoke run on downloaded KITTI Object frames.
dataset: kitti_camera_depth
data_root: data/kitti/training
sample_count: 64
seed: 13
device: auto
epochs: 1
batch_size: 2
learning_rate: 0.001
height: 128
width: 416
max_depth_m: 80.0
holdout_fraction: 0.2
splat_radius_px: 2
splat_sigma_px: 1.0
smooth_l1_beta: 0.1
output_dir: results/training/kitti_camera_depth
