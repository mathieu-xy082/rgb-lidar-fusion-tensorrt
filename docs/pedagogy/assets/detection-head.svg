<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc"><title id="title">Head de détection : des features aux prédictions</title><desc id="desc">Diagnostic actuel : deux convolutions 1x1 donnent une heatmap Car et deux offsets. Décodage des centres, pas de boîtes 3D. La head complète est prévue.</desc><defs><marker id="a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="#53647b"/></marker></defs><rect width="1100" height="850" fill="#f4f7fb"/><g font-family="Arial,sans-serif" fill="#17283f">
<text x="36" y="45" font-size="14" fill="#b96012" font-weight="bold">03 / HEAD : LIRE LES FEATURES</text>
<text x="36" y="88" font-size="30" fill="#17283f" font-weight="bold">Transformer une carte en prédictions localisées</text>
<rect x="36" y="125" width="1028" height="90" rx="12" fill="white" stroke="#b96012" stroke-width="2"/>
<text x="54" y="156" font-size="20" fill="#b96012" font-weight="bold">Entrée actuelle : features après contexte LiDAR</text>
<text x="54" y="186" font-size="16" fill="#17283f">[B, 32, H, W] • diagnostic autonome, sans caméra</text>
<path d="M550 225V243H280V265" fill="none" stroke="#53647b" stroke-width="2" marker-end="url(#a)"/>
<path d="M550 243H820V265" fill="none" stroke="#53647b" stroke-width="2" marker-end="url(#a)"/>
<rect x="36" y="277" width="490" height="145" rx="12" fill="white" stroke="#b96012" stroke-width="2"/>
<text x="54" y="308" font-size="20" fill="#b96012" font-weight="bold">Branche centre Car</text>
<text x="54" y="338" font-size="16" fill="#17283f">Conv 1×1 : 32 → 1</text>
<text x="54" y="364" font-size="16" fill="#17283f">Logits [B, 1, H, W]</text>
<text x="54" y="390" font-size="16" fill="#17283f">Sigmoid → score par cellule</text>
<rect x="574" y="277" width="490" height="145" rx="12" fill="white" stroke="#b96012" stroke-width="2"/>
<text x="592" y="308" font-size="20" fill="#b96012" font-weight="bold">Branche offsets XY</text>
<text x="592" y="338" font-size="16" fill="#17283f">Conv 1×1 : 32 → 2 + sigmoid</text>
<text x="592" y="364" font-size="16" fill="#17283f">Offsets [B, 2, H, W]</text>
<text x="592" y="390" font-size="16" fill="#17283f">Position fractionnaire dans la cellule</text>
<path d="M280 432V459H550V480" fill="none" stroke="#53647b" stroke-width="2" marker-end="url(#a)"/>
<path d="M820 432V459H550" fill="none" stroke="#53647b" stroke-width="2" marker-end="url(#a)"/>
<rect x="36" y="492" width="1028" height="112" rx="12" fill="white" stroke="#b96012" stroke-width="2"/>
<text x="54" y="523" font-size="20" fill="#b96012" font-weight="bold">Décoder les centres</text>
<text x="54" y="553" font-size="16" fill="#17283f">Maxima locaux 3×3 → seuil / top-k → coordonnées métriques x, y et score</text>
<text x="54" y="579" font-size="16" fill="#17283f">x = x_min + (ligne + offset_x) × résolution ; même principe pour y</text>
<text x="36" y="641" font-size="17" fill="#17283f" font-weight="bold">Diagnostic implémenté et testé ; aucun entraînement LiDAR réalisé à ce stade.</text>
<rect x="36" y="675" width="1028" height="130" rx="12" fill="white" stroke="#b96012" stroke-width="2" stroke-dasharray="7 5"/>
<text x="54" y="706" font-size="20" fill="#b96012" font-weight="bold">Cible : head 3D complète, de type CenterPoint</text>
<text x="54" y="736" font-size="16" fill="#17283f">Centres + offsets + hauteur z + dimensions L/l/h + orientation + classes</text>
<text x="54" y="762" font-size="16" fill="#17283f">Les boîtes 3D, leur post-traitement et leur évaluation restent à développer.</text>
</g></svg>