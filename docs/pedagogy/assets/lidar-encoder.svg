<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Encodeur LiDAR : des mesures à la grille</title><desc id="desc">Nuage XYZI, piliers et neuf features, PFN puis scatter. Le contexte spatial vient ensuite.</desc><defs><marker id="a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="#53647b"/></marker></defs><rect width="1100" height="650" fill="#f4f7fb"/><g font-family="Arial,sans-serif" fill="#17283f">
<text x="36" y="45" font-size="14" fill="#235ce0" font-weight="bold">01 / ENCODEUR LIDAR</text>
<text x="36" y="88" font-size="30" fill="#17283f" font-weight="bold">Organiser les mesures et décrire chaque pilier</text>
<rect x="36" y="130" width="295" height="155" rx="12" fill="white" stroke="#235ce0" stroke-width="2"/>
<text x="54" y="161" font-size="20" fill="#235ce0" font-weight="bold">Nuage brut</text>
<text x="54" y="191" font-size="16" fill="#17283f">N points, 4 valeurs par point</text>
<text x="54" y="217" font-size="16" fill="#17283f">x, y, z en mètres + intensité</text>
<text x="54" y="243" font-size="16" fill="#17283f">Nombre de points variable</text>
<rect x="398" y="130" width="666" height="155" rx="12" fill="white" stroke="#235ce0" stroke-width="2"/>
<text x="416" y="161" font-size="20" fill="#235ce0" font-weight="bold">Piliers de 20 cm × 20 cm</text>
<text x="416" y="191" font-size="16" fill="#17283f">Filtrer la zone utile ; conserver au plus M points par pilier</text>
<text x="416" y="217" font-size="16" fill="#17283f">Ajouter les écarts au groupe et au centre du pilier</text>
<text x="416" y="243" font-size="16" fill="#17283f">Features [P, M, 9] + masque [P, M]</text>
<path d="M340 205H386" fill="none" stroke="#53647b" stroke-width="2" marker-end="url(#a)"/>
<path d="M735 295V325" fill="none" stroke="#53647b" stroke-width="2" marker-end="url(#a)"/>
<rect x="36" y="337" width="1028" height="140" rx="12" fill="white" stroke="#235ce0" stroke-width="2"/>
<text x="54" y="368" font-size="20" fill="#235ce0" font-weight="bold">PFN : résumer les points de chaque pilier</text>
<text x="54" y="398" font-size="16" fill="#17283f">Masque → [V, 9] → Linear(9 → 32, sans biais) → BatchNorm → ReLU</text>
<text x="54" y="424" font-size="16" fill="#17283f">Max entre les points, séparément par canal → [P, 32]</text>
<text x="54" y="450" font-size="16" fill="#17283f">Poids partagés ; max par pilier. BatchNorm agrège les points valides du lot.</text>
<path d="M550 485V515" fill="none" stroke="#53647b" stroke-width="2" marker-end="url(#a)"/>
<rect x="36" y="527" width="1028" height="93" rx="12" fill="white" stroke="#235ce0" stroke-width="2"/>
<text x="54" y="558" font-size="20" fill="#235ce0" font-weight="bold">Scatter : placer les vecteurs dans leurs cellules</text>
<text x="54" y="588" font-size="16" fill="#17283f">[P, 32] + indices (batch, ligne_x, colonne_y) → carte [B, 32, H, W]</text>
</g></svg>