<text x="1100" y="445" font-size="16" fill="#17283f">Conv 1×1</text>
<text x="1100" y="473" font-size="16" fill="#17283f">32 → 2</text>
<text x="990" y="561" font-size="17" fill="#17283f" font-weight="bold">[2,250,250]</text>
<text x="1100" y="310" font-size="15" fill="#b96012">Logits Car</text>
<text x="1100" y="505" font-size="15" fill="#b96012">Offsets XY</text>
<text x="35" y="610" font-size="20" fill="#17283f" font-weight="bold">32 canaux fixés par configuration ; leurs valeurs dépendent des poids et des entrées.</text>
<text x="35" y="646" font-size="17" fill="#17283f">Pas de pooling spatial ni de couches fully connected dans ce chemin. Les deux blocs sont résiduels.</text>
<text x="35" y="676" font-size="17" fill="#53647b">À venir : fusion avec camera BEV → backbone commun → head 3D complète (architecture non figée).</text>
<text x="35" y="708" font-size="15" fill="#53647b">Volumes schématiques non à l’échelle ; diagnostic LiDAR implémenté mais non entraîné.</text>
