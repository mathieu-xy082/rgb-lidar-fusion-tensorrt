<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="730" viewBox="0 0 1280 730" role="img" aria-labelledby="title desc"><title id="title">Volumes et dimensions du chemin LiDAR actuel</title><desc id="desc">Piliers P par M par 9, PFN P par 32, scatter puis deux blocs résiduels à 32 canaux et résolution 250 par 250 constante. La head produit une heatmap Car et deux offsets XY, sans couches fully connected.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="#53647b"/></marker></defs><rect width="1280" height="730" fill="#f4f7fb"/><g font-family="Arial,sans-serif" fill="#17283f">
<text x="35" y="42" font-size="14" fill="#235ce0" font-weight="bold">LIRE LE RÉSEAU PAR SES VOLUMES</text>
<text x="35" y="82" font-size="32" fill="#17283f" font-weight="bold">Des piliers aux cartes de prédiction</text>
<text x="35" y="116" font-size="17" fill="#17283f">Dimensions nominales ; batch B omis sur les volumes. Profondeur dessinée = canaux, pas hauteur physique.</text>
