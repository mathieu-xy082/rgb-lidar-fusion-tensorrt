<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="860" viewBox="0 0 1120 860" role="img" aria-labelledby="title desc">
<title id="title">Du nuage LiDAR à la carte BEV : situer le PFN</title><desc id="desc">Les points XYZI sont regroupés en piliers de 20 cm, puis le PFN transforme neuf caractéristiques en trente-deux canaux et agrège par max. Le scatter place les vecteurs dans la grille. Les convolutions dilatées ajoutent ensuite le contexte spatial. La fusion et la détection sont une cible.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8" fill="#52647d"/></marker></defs>
<rect width="1120" height="860" fill="#f3f6fa"/><g font-family="Arial, sans-serif" fill="#17283f">
<text x="44" y="45" font-size="13" fill="#235ce0" font-weight="bold">COMPRENDRE LA BRANCHE LIDAR</text><text x="44" y="86" font-size="32" font-weight="bold">Transformer des points en une grille de features</text><text x="44" y="118" font-size="17">Prototype implémenté • encodeur non entraîné à la détection</text>
<rect x="44" y="150" width="300" height="190" rx="16" fill="#fff" stroke="#c8d4e5"/><text x="64" y="182" font-size="20" font-weight="bold">1. Mesurer</text><text x="64" y="212" font-size="16">Nuage brut : [N, 4]</text><text x="64" y="238" font-size="15">x, y, z, intensité</text><g fill="#235ce0"><circle cx="85" cy="288" r="5"/><circle cx="117" cy="270" r="5"/><circle cx="150" cy="299" r="5"/><circle cx="188" cy="278" r="5"/><circle cx="222" cy="308" r="5"/><circle cx="258" cy="265" r="5"/></g>
<path d="M350 245H390" stroke="#52647d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="400" y="150" width="676" height="190" rx="16" fill="#fff" stroke="#c8d4e5"/><text x="422" y="182" font-size="20" font-weight="bold">2. Construire les piliers</text><text x="422" y="214" font-size="16">Cellules XY de 20 cm • pas de subdivision verticale</text><text x="422" y="244" font-size="16">Points retenus → position, intensité et écarts géométriques</text><text x="422" y="279" font-size="21" fill="#235ce0" font-weight="bold">Features [P, M, 9] + masque [P, M]</text><text x="422" y="309" font-size="15">P piliers occupés • M = 64 places par défaut • padding exclu</text>
<path d="M738 345V380" stroke="#52647d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="44" y="390" width="1032" height="195" rx="16" fill="#eaf0ff" stroke="#235ce0" stroke-width="2"/><text x="66" y="424" font-size="23" font-weight="bold" fill="#1848b0">3. PFN : résumer chaque pilier</text>
<text x="66" y="462" font-size="17">Filtrer le masque → [V, 9]</text><text x="410" y="462" font-size="17">Linear sans biais → [V, 32]</text><text x="760" y="462" font-size="17">BatchNorm → ReLU</text>
<path d="M325 456H390" stroke="#52647d" stroke-width="2" marker-end="url(#arrow)"/><path d="M700 456H742" stroke="#52647d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="66" y="505" font-size="17">Regrouper par pilier → max entre points, séparément pour chaque canal</text><text x="66" y="544" font-size="22" fill="#1848b0" font-weight="bold">Sortie [P, 32] : 32 valeurs par pilier, quel que soit son nombre de points</text><text x="66" y="570" font-size="14">V = nombre total de points valides • BatchNorm les agrège en entraînement • aucun voisinage spatial ici</text>
<path d="M275 590V620" stroke="#52647d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="44" y="630" width="480" height="138" rx="16" fill="#fff" stroke="#127761"/><text x="66" y="662" font-size="20" font-weight="bold" fill="#127761">4. Scatter : placer sans mélanger</text><text x="66" y="694" font-size="17">[B, 32, 250, 250] pour la ROI initiale</text><text x="66" y="722" font-size="15">Lignes : x avant • colonnes : y gauche</text><text x="66" y="747" font-size="15">Compteurs de mesures conservés séparément</text>
<path d="M530 700H568" stroke="#52647d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="580" y="630" width="496" height="138" rx="16" fill="#fff" stroke="#bc6216"/><text x="602" y="662" font-size="20" font-weight="bold" fill="#bc6216">5. Ajouter le contexte spatial</text><text x="602" y="694" font-size="17">Deux blocs résiduels • dilatations 1, 2, 2, 4</text><text x="602" y="722" font-size="15">Champ théorique 19 × 19 cellules = 3,8 × 3,8 m</text><text x="602" y="747" font-size="15">Même grille • pas une preuve de détection</text>
<text x="44" y="811" font-size="16">Cible suivante : fusion avec camera BEV, puis têtes de détection 3D.</text><text x="44" y="837" font-size="14" fill="#53647b">Schéma pédagogique : voir les jalons et le contrat technique pour l’état détaillé du projet.</text></g></svg>
