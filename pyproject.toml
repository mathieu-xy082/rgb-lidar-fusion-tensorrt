[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
name = "rgb-lidar-fusion-tensorrt"
version = "1.0.0"
description = "Camera-LiDAR fusion prototype with PyTorch, ONNX, and TensorRT deployment path."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Mathieu" }]
dependencies = [
  "numpy>=1.24",
]

[dependency-groups]
dev = [
  "pytest>=8",
]
ml = [
  "torch>=2.3",
  "pillow>=10",
]
onnx = [
  "onnx>=1.16",
  "onnxruntime>=1.18",
  "onnxscript>=0.1",
]

[tool.pdm]
distribution = true

[tool.pdm.scripts]
test = "pytest"
smoke = "python scripts/smoke_project_lidar.py"
demo-artifacts = "python -m rgb_lidar_fusion.demo_artifacts"
train-baseline = "python scripts/train_baseline.py"
train-camera-depth = "python scripts/train_camera_depth.py"
validate = { composite = ["test", "smoke", "demo-artifacts"] }
export_onnx = "python scripts/export_onnx.py"
validate_onnx = "python scripts/validate_onnx.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
