[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rgb-lidar-fusion-tensorrt"
version = "0.1.0"
description = "Camera-LiDAR fusion prototype with PyTorch, ONNX, and TensorRT deployment path."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Mathieu" }]
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]
ml = [
  "torch",
  "torchvision",
  "onnx",
  "onnxruntime",
]
visualization = [
  "opencv-python",
  "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
